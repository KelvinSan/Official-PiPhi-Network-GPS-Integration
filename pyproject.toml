[project]
name = "official-piphi-network-gps-integration"
version = "1.1.0"
description = "Python PiPhi runtime for USB and NMEA-compatible GPS receivers."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "paho-mqtt>=2.1.0",
  "pynmea2>=1.19.0",
  "pyserial>=3.5",
  "uvicorn[standard]>=0.30.0",
  "piphi-runtime-kit-python>=0.7.1,<1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
piphi-network-gps = "piphi_network_gps.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piphi_network_gps"]

[tool.hatch.build.targets.wheel.force-include]
"src/manifest.json" = "piphi_network_gps/manifest.json"
"src/behaviors.json" = "piphi_network_gps/behaviors.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests_python"]
